services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: safetyvault-sql
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    restart: unless-stopped

volumes:
  sqldata: